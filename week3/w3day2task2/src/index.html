<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tian</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    anton: ['Anton', 'sans-serif'],
                }
            }
        }
    }
</script>
</head>

<body class="bg-white dark:bg-black text-black dark:text-white transition duration-300">

    <!-- HEADER -->
    <header
        class="w-full px-6 md:px-12 py-6 flex items-center justify-between backdrop-blur-md bg-white/70 dark:bg-black/40  top-0 z-50">

        <!-- Logo -->
        <div class="flex items-center gap-2">

            <!-- Light Logo -->
            <img src="./image/Group 1.png" class="w-6 h-6 block dark:hidden">

            <!-- Dark Logo -->
            <img src="./image/Group.png" class="w-6 h-6 hidden dark:block">

            <h1 class="text-lg font-semibold tracking-wide">tian</h1>
        </div>

        <!-- Navbar -->
        <nav class="hidden md:flex gap-8 text-sm font-medium">
            <a href="#" class="hover:text-purple-500">Home</a>
            <a href="#" class="hover:text-purple-500">Portfolio</a>
            <a href="#" class="hover:text-purple-500">Skills</a>
            <a href="#" class="hover:text-purple-500">About Me</a>
        </nav>

        <!-- Right -->
        <div class="flex items-center gap-4">

            <!-- Toggle -->
            <button id="themeToggle" class="w-14 h-8 flex items-center bg-[#FFEC70] dark:bg-[#FFEC70] rounded-full p-1">
                <div id="toggleCircle"
                    class="w-6 h-6 bg-white dark:bg-black rounded-full flex items-center justify-center text-xs transition">
                    <span id="icon">🌙</span>
                </div>
            </button>

            <!-- Contact -->
            <button class="hidden md:block bg-black dark:bg-[#925FF0] text-white  px-5 py-2 rounded-md text-sm">
                Contact Me
            </button>

            <!-- Mobile Button -->
            <button id="menuBtn" class="md:hidden text-xl">
                <i class="fa-solid fa-bars"></i>
            </button>

        </div>
    </header>

    <!-- MOBILE MENU -->
    <div id="mobileMenu"
        class="fixed top-0 right-[-100%] w-64 h-full bg-white dark:bg-black shadow-lg transition-all duration-300 z-50 p-6 flex flex-col gap-6">

        <button id="closeMenu" class="self-end text-2xl">✕</button>

        <a href="#" class="text-lg">Home</a>
        <a href="#" class="text-lg">Portfolio</a>
        <a href="#" class="text-lg">Skills</a>
        <a href="#" class="text-lg">About</a>
    </div>

    <!-- OVERLAY -->
    <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-40"></div>

    <!-- HERO -->
    <section class="w-full px-6 md:px-12 py-10 flex flex-col lg:flex-row items-center gap-5">

        <!-- LEFT -->
        <div class="flex-1 text-center lg:text-left">
            <h1 class="font-anton lg:flex text-7xl md:text-[150px] font-bold">
                PRODUCT<br>DESIGNER
                <div class="hidden lg:block w-28">
                    <!-- Dark mode image -->
                    <img class="mt-3 block dark:hidden" src="/image/Portal.png" alt="">
                    <!-- Light mode image -->
                    <img class="mt-3 hidden dark:block" src="/image/Portal1.png" alt="">
                </div>
            </h1>
            <p class="pt-3 text-[40px] md:text-[85px] leading-tight font-anton font-bold bg-gradient-to-r from-pink-500 to-yellow-400 text-transparent bg-clip-text">
                CRISTIAN MUÑOZ
            </p>

            <!-- Social -->
            <div class="mt-8 flex justify-center lg:justify-between text-[30px] lg:mr-[116px] gap-2 md:gap-14">
                <i class="fab fa-instagram border p-0.5 rounded-[4px]"></i>
                <i class="fa-brands fa-figma border p-0.5 rounded-[4px]"></i>
                <i class="fab fa-linkedin border p-0.5 rounded-[4px]"></i>
                <i class="fab fa-twitter border p-0.5 rounded-[4px]"></i>
                <i class="fa-brands fa-telegram border p-0.5 rounded-[4px]"></i>
                <i class="fa-brands fa-facebook border p-0.5 rounded-[4px]"></i>
            </div>

            <button class=" mt-8 px-7 md:px-[150px] lg:px-[145px] py-3 bg-black text-white dark:bg-white dark:text-black rounded-lg">
                Download Curriculum Vitae
                <i class="fa-solid fa-angle-right"></i>
            </button>
        </div>

        <!-- RIGHT (VISIBLE ONLY ON DESKTOP) -->
        <div class="hidden lg:block flex-1 justify-center">

            <img src="/image/colorful-vintage-collage-design 1.png"
                class="w-full max-w-md h-[600px] rounded-xl shadow-2xl">
        </div>

    </section>

    <!-- SCRIPT -->
    <script src="./script.js"></script>

</body>

</html>
